name: Build Club100 Production Image

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout club100_core
        uses: actions/checkout@v4

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Copy apps.json
        run: |
          cp deploy/apps.json frappe_docker/apps.json

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        working-directory: frappe_docker
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg FRAPPE_BRANCH=version-16 \
            --build-arg CACHE_BUST="${GITHUB_SHA}" \
            --secret id=apps_json,src=apps.json \
            --tag ghcr.io/sushhil-pal/club100-erp:${GITHUB_SHA} \
            --tag ghcr.io/sushhil-pal/club100-erp:latest \
            --file images/custom/Containerfile \
            --push \
            .